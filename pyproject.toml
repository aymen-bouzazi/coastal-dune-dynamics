[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coastal-dune-dynamics"
version = "0.1.0"
description = "Report-guided coastal land-cover scenarios and dune-front measurements"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.13,<2", "pandas>=2.2,<3", "rasterio>=1.4,<2", "shapely>=2,<3", "fiona>=1.9,<2", "matplotlib>=3.8,<4"]

[project.scripts]
coastal-dunes = "coastaldunes.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["coastaldunes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E9", "F", "I"]
